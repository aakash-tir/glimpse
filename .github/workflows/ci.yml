# CI: the gates from .claude/rules/milestone-workflow.md (lint, format, typecheck,
# unit/component/integration/build tests, E2E).
#
# Kept lean on Actions minutes: pull requests only (the merge to main re-runs nothing,
# the PR already tested it), and only when a file this check depends on changed.
# Docs-only changes (docs/, logs/, graphify-out/, *.md) run no CI at all. Run it by
# hand from the Actions tab (workflow_dispatch) when needed — e.g. on a milestone
# branch that is merged locally rather than through a PR:
# `gh workflow run ci.yml --ref <branch>`.
#
# Runs on windows-latest because Glimpse is a Windows-only app and the
# E2E specs drive a real Electron window — the usual "run it on Linux
# under xvfb" shortcut would be testing a platform the app does not
# target. One workflow, not one per area: the E2E step needs the same
# Windows runner and `npm ci`, so splitting it out would pay for both twice.
name: CI

on:
  pull_request:
    paths:
      - 'src/**'
      - 'test/**'
      - 'fixtures/**'
      - '**/*.json'
      - 'electron.vite.config.ts'
      - 'vitest.config.ts'
      - 'playwright*.config.ts'
      - 'eslint.config.js'
      - '.prettierignore'
      - 'app-icon.*'
      - '.github/workflows/**'
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gates:
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # Electron 43 and its build toolchain declare node >= 22.12.
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      # Steps 1-3 of the end-of-milestone checks, in the documented
      # order. Each runs even if an earlier one failed, so a single
      # push reports every problem at once rather than one per round.
      - name: Lint
        if: '!cancelled()'
        run: npm run lint

      - name: Format
        if: '!cancelled()'
        run: npm run format:check

      - name: Typecheck
        if: '!cancelled()'
        run: npm run typecheck

      - name: Unit / component / integration / build tests
        if: '!cancelled()'
        run: npx vitest run --passWithNoTests test/unit test/component test/integration test/build

      # Drives the built Electron binary, so it needs the build first —
      # which `npm run test:e2e` does itself.
      - name: E2E
        if: '!cancelled()'
        run: npm run test:e2e

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
          if-no-files-found: ignore
